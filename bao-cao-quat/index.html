<style>:root{

  --amber:#F59E0B;--amber-bg:#FFF6DD;--green:#16A34A;--green-bg:#E7F7EC;--violet:#6D4AE0;--violet-bg:#EFEBFD;
  --bg:#F3F6FA;--card:#FFFFFF;--ink:#0F1B33;--muted:#5A6B86;--line:#DCE3EE;--hl:#FFE94D;
  --shadow:0 1px 2px rgba(15,27,51,.06),0 8px 24px rgba(15,27,51,.06);
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
:root[data-theme=dark]{
  --bg:#0C1424;--card:#142036;--ink:#EAF0FB;--muted:#9FB0CC;--line:#273650;--red-bg:#3A1620;--teal-bg:#0F2F38;--sky-bg:#0F2A3F;--amber-bg:#3A2C0C;--green-bg:#0F2E1C;--violet-bg:#241D47;--navy:#9CC0FF;--navy-2:#7FAEFF;--teal:#48C3D8;--red:#FF4D6A;--red-d:#FF7A90;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.topbar{position:fixed;inset:0 0 auto 0;height:56px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:50;display:flex;align-items:center;gap:12px;padding:0 16px}
.topbar .brand{font-weight:800;color:var(--red);letter-spacing:.2px;white-space:nowrap}
.topbar .ttl{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.topbar button,.topbar select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
.progress{position:fixed;top:56px;left:0;height:3px;background:var(--red);width:0;z-index:51;transition:width .15s}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:0;padding-top:56px}
.toc{position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow:auto;padding:16px 12px 40px 16px;border-right:1px solid var(--line);background:var(--card)}
.toc h4{margin:14px 0 6px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.toc a{display:flex;gap:8px;text-decoration:none;font-size:13px;padding:5px 8px;border-radius:8px;color:var(--ink)}
.toc a .n{min-width:22px;color:var(--muted);font-variant-numeric:tabular-nums}
.toc a:hover{background:var(--bg)}
.toc a.on{background:var(--red-bg);color:var(--red);font-weight:600}
main{padding:24px clamp(12px,3vw,40px) 80px;display:flex;flex-direction:column;gap:28px;min-width:0}
.page{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;max-width:1240px;width:100%;margin:0 auto;position:relative}
.page>.ph{padding:22px 28px 8px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--red)}
.page h2{margin:2px 0 0;font-size:clamp(22px,2.6vw,32px);line-height:1.2;color:var(--ink);letter-spacing:-.3px}
.page h2 em{font-style:normal;color:var(--red)}
.pn{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px;white-space:nowrap}
.lead{padding:0 28px;margin:6px 0 0;color:var(--muted);font-size:15.5px;max-width:980px}
.pb{padding:18px 28px 8px}
.insight{margin:12px 28px 6px;padding:14px 18px;border-radius:14px;background:var(--red-bg);border-left:5px solid var(--red);font-weight:600;font-size:15px}
.insight.neutral{background:var(--sky-bg);border-left-color:var(--sky)}
.insight small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.srcbar{margin:10px 28px 22px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.srcbar .lb{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;line-height:1.2;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer;transition:transform .08s,box-shadow .12s;max-width:100%}
.chip:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,27,51,.12)}
.chip .ic{font-size:11px;opacity:.85}
.chip .tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--hl);color:#3a2e00}
.chip.web{border-color:color-mix(in srgb,var(--teal) 45%,var(--line));background:var(--teal-bg)}
.chip.bmk{border-color:color-mix(in srgb,var(--amber) 55%,var(--line));background:var(--amber-bg)}
.chip.sl{border-color:color-mix(in srgb,var(--violet) 45%,var(--line));background:var(--violet-bg)}
.chip.doc{cursor:default;background:var(--bg);color:var(--muted)}
.chip.doc:hover{transform:none;box-shadow:none}
.chip .warn{color:#B45309;font-weight:800}
/* components */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.card{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card.w{background:var(--card)}
.card h4{margin:0 0 6px;font-size:15px}
.card p{margin:4px 0;color:var(--muted);font-size:13.5px}
.big{font-size:clamp(30px,4vw,52px);font-weight:800;line-height:1;letter-spacing:-1px;color:var(--red);font-variant-numeric:tabular-nums}
.big.navy{color:var(--navy)}.big.teal{color:var(--teal)}.big.sky{color:var(--sky)}
.big small{font-size:.42em;font-weight:700;letter-spacing:0;margin-left:4px;color:var(--muted)}
.cap{font-size:13px;color:var(--muted)}
.tile{border-radius:16px;padding:16px 18px;background:var(--bg);border:1px solid var(--line)}
.tile.red{background:var(--red-bg);border-color:color-mix(in srgb,var(--red) 30%,var(--line))}
.tile.navy{background:var(--navy);color:#fff;border-color:transparent}.tile.navy .cap{color:#C9D6EE}.tile.navy .big{color:#fff}
.tile.teal{background:var(--teal-bg)}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--navy);color:#fff}
.pill.red{background:var(--red)}.pill.teal{background:var(--teal)}.pill.gray{background:#8A97AD}.pill.amber{background:var(--amber);color:#3a2800}.pill.green{background:var(--green)}.pill.sky{background:var(--sky)}
.hb{display:grid;grid-template-columns:minmax(120px,210px) 1fr auto;gap:10px;align-items:center;margin:7px 0}
.hb .l{font-size:13.5px}.hb .t{height:22px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.hb .f{height:100%;border-radius:7px;background:var(--navy);width:var(--w);animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.hb .f.red{background:var(--red)}.hb .f.sky{background:var(--sky)}.hb .f.teal{background:var(--teal)}.hb .f.gray{background:#9AA7BC}.hb .f.amber{background:var(--amber)}
.hb .v{font-weight:700;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
@keyframes grow{from{width:0}}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:9px 12px;font-weight:600;font-size:12.5px}
table.t th:first-child{border-radius:10px 0 0 0}table.t th:last-child{border-radius:0 10px 0 0}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 70%,transparent)}
table.t td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.t .b{font-weight:700}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
.quote{border-left:4px solid var(--sky);background:var(--sky-bg);border-radius:0 12px 12px 0;padding:10px 14px;font-size:14px;font-style:italic}
.quote cite{display:block;font-style:normal;font-size:11.5px;color:var(--muted);margin-top:4px}
.quote.red{border-color:var(--red);background:var(--red-bg)}
.arrow{color:var(--amber);font-weight:900}
.shift{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin:6px 0}
.shift .a{padding:4px 10px;border-radius:8px;background:#E4E9F1;color:#44546F}
.shift .b{padding:4px 10px;border-radius:8px;background:var(--navy);color:#fff;font-weight:600}
.layerbox{border-radius:16px;padding:14px;color:#fff}
.layerbox h4{margin:0;font-size:12px;letter-spacing:.6px;text-transform:uppercase;opacity:.9}.layerbox h3{margin:2px 0 8px;font-size:18px}
.layerbox ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}.layerbox li{background:rgba(255,255,255,.16);border-radius:9px;padding:6px 9px;font-size:13px}
.heat td.h1{background:var(--red);color:#fff;font-weight:800;text-align:center}.heat td.h2{background:#FFD3DA;font-weight:800;text-align:center;color:#7a0016}.heat td.h3{background:#FFE9ED;font-weight:700;text-align:center;color:#7a0016}.heat td.hn{text-align:center;color:var(--muted)}
svg text{font-family:var(--font)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.sec{min-height:62vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px;padding:28px}
.sec .bigno{font-size:clamp(100px,18vw,220px);font-weight:900;line-height:.85;color:var(--red);letter-spacing:-8px}
.sec h2{font-size:clamp(28px,4vw,48px)}
.sec .art{border-radius:20px;background:linear-gradient(135deg,var(--sky-bg),var(--red-bg));min-height:260px;display:grid;place-items:center;padding:20px}
.cover{background:radial-gradient(1200px 500px at 90% -10%,var(--red-bg),transparent 60%),radial-gradient(900px 500px at -10% 110%,var(--sky-bg),transparent 60%),var(--card);min-height:76vh;padding:40px 36px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.cover h1{margin:0;font-size:clamp(34px,6vw,72px);line-height:1.04;letter-spacing:-2px}
.cover h1 b{color:var(--red)}
.cover .meta{color:var(--muted);font-size:15px}
.cover .logo{display:inline-block;background:var(--red);color:#fff;font-weight:800;border-radius:999px;padding:6px 16px;letter-spacing:1px;width:max-content}
.floor{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(64px,auto);gap:8px}
.room{border-radius:14px;padding:10px 12px;border:1px solid var(--line);background:var(--sky-bg);font-size:13px}
.room b{display:block;font-size:14px}.room .n{font-size:26px;font-weight:800;color:var(--navy);line-height:1}
.room.hot{background:var(--red-bg);border-color:var(--red)}
.steps{display:flex;gap:0;flex-wrap:wrap}.steps>div{flex:1;min-width:140px;padding:12px 14px;background:var(--bg);border:1px solid var(--line);margin-left:-1px}
.rank{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);margin:6px 0}
.rank .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--red);color:#fff;flex:none}
.note-b{font-size:12.5px;color:var(--muted);margin-top:8px}
.warnbox{background:var(--amber-bg);border:1px solid #F3C969;border-left:5px solid var(--amber);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:10px 0}
.okbox{background:var(--green-bg);border-left:5px solid var(--green);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:10px 0}
mark,.hl{background:var(--hl);color:#1a1400;padding:1px 3px;border-radius:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* modal */
.mo{position:fixed;inset:0;background:rgba(7,14,30,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.mo.open{display:flex}
.mo .box{background:var(--card);border-radius:18px;max-width:1100px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.mo .bh{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;justify-content:space-between;align-items:flex-start;background:var(--bg)}
.mo .bh h3{margin:2px 0 0;font-size:19px}.mo .bh .fn{font-size:12px;color:var(--muted)}
.mo .x{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer;color:var(--ink)}
.mo .bb{padding:16px 22px 22px;max-height:78vh;overflow:auto}
.claim{background:var(--sky-bg);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.claim b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:2px}
.mo table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 16px}
.mo th{background:var(--navy);color:#fff;text-align:left;padding:7px 9px;position:sticky;top:0;font-weight:600}
.mo td{border-bottom:1px solid var(--line);padding:6px 9px;vertical-align:top}
.mo caption{caption-side:top;text-align:left;font-weight:700;font-size:13px;padding:6px 0}
.mo .tw{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
.mo td.ref{font-size:11px;color:var(--muted);white-space:nowrap}
.mo .tools{display:flex;gap:8px;align-items:center;margin:6px 0}
.mo .tools input{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);flex:1}
.kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--card)}
.hint{position:fixed;right:14px;bottom:14px;background:var(--navy);color:#fff;border-radius:12px;padding:8px 12px;font-size:12px;z-index:40;opacity:.92}
:root[data-theme=dark] .hint{background:#0e2a52}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.toc{position:fixed;left:0;top:56px;width:280px;z-index:60;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}.toc.open{transform:none}
 .g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.sec{grid-template-columns:1fr}.hint{display:none}}
@media (max-width:640px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.page>.ph,.pb,.lead{padding-left:16px;padding-right:16px}.insight,.srcbar{margin-left:16px;margin-right:16px}.hb{grid-template-columns:1fr auto}.hb .t{grid-column:1/-1;order:3}.topbar .ttl{display:none}}
@media print{.topbar,.toc,.hint,.progress{display:none}.layout{display:block;padding:0}.page{break-after:page;box-shadow:none}}
</style>
<script>try{var t=localStorage.getItem('th');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>

/* ===== helpers ===== */
const enc = t => encodeURIComponent(t).replace(/-/g,'%2D');
function webHref(w){
  const qs = w.q.map(x => 'text=' + enc(x.s) + (x.e ? ',' + enc(x.e) : '')).join('&');
  return w.url + '#:~:' + qs;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function chip(id, label){
  if(WEB[id]){
    const w=WEB[id];
    const tip=w.full.join('  |  ').replace(/"/g,'&quot;');
    return `<a class="chip web" href="${webHref(w)}" target="_blank" rel="noopener noreferrer" title="${tip}"><span class="ic">↗</span>${esc(label||w.label)}${w.warn?'<span class="warn" title="'+esc(w.warn)+'">⚠</span>':''}<span class="tag">bôi vàng</span></a>`;
  }
  if(EVL[id]){
    const e=EVD[id]; const kind=id[0]==='b'?'bmk':'sl';
    const ic=kind==='bmk'?'▦':'❝';
    const warn=e&&e.warn?'<span class="warn" title="Có điểm cần đối chiếu">⚠</span>':'';
    return `<button class="chip ${kind}" data-ev="${id}"><span class="ic">${ic}</span>${esc(label||EVL[id])}${warn}<span class="tag">xem số liệu</span></button>`;
  }
  if(DOC[id]) return `<span class="chip doc"><span class="ic">✎</span>${esc(label||DOC[id])}</span>`;
  return `<span class="chip doc">${esc(id)}</span>`;
}
const hb=(l,v,max,disp,cls='')=>`<div class="hb"><div class="l">${l}</div><div class="t"><div class="f ${cls}" style="--w:${Math.max(1,v/max*100).toFixed(1)}%"></div></div><div class="v">${disp}</div></div>`;
const tile=(big,cap,cls='',unit='')=>`<div class="tile ${cls}"><div class="big">${big}${unit?`<small>${unit}</small>`:''}</div><div class="cap">${cap}</div></div>`;
const Q=(t,c,cls='')=>`<div class="quote ${cls}">“${t}”${c?`<cite>${c}</cite>`:''}</div>`;
const shift=(a,b)=>`<div class="shift"><span class="a">${a}</span><span class="arrow">➜</span><span class="b">${b}</span></div>`;

/* ===== modal bằng chứng Excel ===== */
function cellHTML(t){
  t=String(t);
  if(!t.includes('⟦')) return esc(t);
  return esc(t).replace(/⟦/g,'<mark>').replace(/⟧/g,'</mark>');
}
function openEv(id){
  const e=EVD[id]; if(!e) return;
  const fn = e.file==='bmk' ? '260824_BMK_QUAT_4DONG_NTD_v4.xlsx' : 'Quat-gia-dung_Social_Listening_V1.xlsx';
  let h=`<div class="claim"><b>Slide nói</b>${esc(e.claim)}</div>`;
  if(e.warn) h+=`<div class="warnbox"><b>⚠ Cần đối chiếu:</b> ${esc(e.warn)}</div>`;
  if(e.note) h+=`<div class="note-b">${esc(e.note)}</div>`;
  h+=`<div class="tools"><input type="search" placeholder="Lọc nhanh trong các bảng bên dưới…" oninput="filterEv(this.value)"><span class="cap">Ô được dùng làm bằng chứng được bôi <mark>vàng</mark></span></div>`;
  e.tables.forEach(t=>{
    h+=`<table><caption>${esc(t.cap)}</caption><thead><tr>${t.head.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>`;
    t.rows.forEach(r=>{h+='<tr>'+r.map((c,i)=>`<td${/!|^\d+$/.test(c)&&i===0?' class="ref"':''}>${cellHTML(c)}</td>`).join('')+'</tr>'});
    h+='</tbody></table>';
  });
  const m=document.getElementById('mo');
  m.querySelector('.fn').textContent=(e.file==='bmk'?'File benchmark · ':'File social listening · ')+fn;
  m.querySelector('h3').textContent=e.title;
  m.querySelector('.bb').innerHTML=h;
  m.classList.add('open'); document.body.style.overflow='hidden';
  const first=m.querySelector('mark'); if(first) setTimeout(()=>first.scrollIntoView({block:'center'}),80);
}
function filterEv(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll('#mo tbody tr').forEach(tr=>{tr.style.display=!q||tr.textContent.toLowerCase().includes(q)||tr.querySelector('mark')?'':'none'});
}
function closeEv(){document.getElementById('mo').classList.remove('open');document.body.style.overflow=''}

/* ===== dựng trang ===== */
function buildPages(PAGES){
  const main=document.getElementById('pages'), toc=document.getElementById('toc');
  let lastPart='', tocH='';
  PAGES.forEach((p,i)=>{
    const sec=document.createElement('section');
    sec.className='page'+(p.cls?' '+p.cls:''); sec.id='p'+(i+1); sec.dataset.i=i;
    const hdr = p.raw ? '' : `<div class="ph"><div><div class="eyebrow">${p.part||''}</div><h2>${p.title||''}</h2></div><div class="pn">${i+1} / ${PAGES.length}</div></div>${p.lead?`<p class="lead">${p.lead}</p>`:''}`;
    const body = p.raw ? p.html : `<div class="pb">${p.html}</div>`;
    const ins = p.ins ? `<div class="insight ${p.insCls||''}">${p.ins}${p.insSub?`<small>${p.insSub}</small>`:''}</div>`:'';

    sec.innerHTML=hdr+body+ins+src;
    main.appendChild(sec);
    if(p.toc){
      if(p.part!==lastPart && p.partToc){tocH+=`<h4>${p.partToc}</h4>`;lastPart=p.part}
      tocH+=`<a href="#p${i+1}" data-i="${i}"><span class="n">${i+1}</span><span>${p.toc}</span></a>`;
    }
  });
  toc.innerHTML=tocH;
}
function wire(PAGES){
  document.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-ev]'); if(b){openEv(b.dataset.ev);return}
    if(ev.target.id==='mo'||ev.target.closest('.x')) closeEv();
    if(ev.target.closest('#menu')) document.getElementById('toc').classList.toggle('open');
    else if(ev.target.closest('.toc a')) document.getElementById('toc').classList.remove('open');
    if(ev.target.closest('#theme')){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('th',r.dataset.theme)}catch(e){}}
  });
  const pages=[...document.querySelectorAll('.page')];
  const links=[...document.querySelectorAll('.toc a')];
  const prog=document.querySelector('.progress'), ttl=document.getElementById('cur');
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{if(e.isIntersecting){const i=+e.target.dataset.i;cur=i;
      links.forEach(a=>a.classList.toggle('on',+a.dataset.i===i));
      const p=PAGES[i]; ttl.textContent=(p.part?p.part+' · ':'')+(p.toc||p.title||'');
      prog.style.width=((i+1)/PAGES.length*100)+'%';
      const on=document.querySelector('.toc a.on'); if(on) on.scrollIntoView({block:'nearest'});}});
  },{rootMargin:'-40% 0px -55% 0px'});
  pages.forEach(p=>io.observe(p));
  let cur=0;
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeEv();
    if(document.getElementById('mo').classList.contains('open')) return;
    if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();pages[Math.min(cur+1,pages.length-1)].scrollIntoView({behavior:'smooth',block:'start'})}
    if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();pages[Math.max(cur-1,0)].scrollIntoView({behavior:'smooth',block:'start'})}
  });
  setTimeout(()=>{const h=document.querySelector('.hint');if(h)h.style.display='none'},9000);
  document.getElementById('jump').addEventListener('change',e=>{const i=+e.target.value;if(i>=0)pages[i].scrollIntoView({behavior:'smooth'});});
}

 [0,400,800,1200,1600,2000].forEach(v=>{s+=`<text x="${X(v)}" y="240" text-anchor="middle" font-size="11" fill="var(--muted)">${v.toLocaleString('vi-VN')}</text>`});
